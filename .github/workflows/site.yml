# One deployment for the whole site: the website (web/) at the root and the PC app (desktop/) under
# app/, built and published together to the gh-pages branch, which GitHub Pages serves.
# Runs on every push to main, or by hand from the Actions tab.
name: Site

on:
  push:
    branches: [main]
    paths: ["web/**", "desktop/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write # to push the built site to gh-pages

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the PC app (after its tests)
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run build

      - name: Put the website and the PC app together
        run: |
          mkdir _site
          cp -r web/. _site/
          cp -r desktop/dist _site/app
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/app/index.html

      - name: Publish to gh-pages
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Site from ${{ github.sha }}"
          # gh-pages only ever holds the latest build, so it is replaced each time.
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages
