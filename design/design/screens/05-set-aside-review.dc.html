<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set aside</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FFB547}a:hover{color:#FFCB7A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0C; color: #F3EFE7; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 8px 16px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #141417; color: #F3EFE7; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 900; font-stretch: 125%">SET ASIDE</h1>
  </header>

  <p style="margin: 4px 20px 12px 20px; font-size: 14px; line-height: 1.45; color: #A9A6AE">These were moved to <span style="font-family: 'IBM Plex Mono', monospace; color: #F3EFE7">_set_aside/</span> in your music folder so they stay out of mixes. Nothing was deleted.</p>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; overflow: hidden">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0">
          <h2 style="margin: 0; font-size: 13px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.06em">{{g.name}}</h2>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9A6AE">{{g.count}}</span>
        </div>
        <sc-for list="{{g.files}}" as="f" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 60px; border-top: 1px solid #1C1C21">
            <button aria-label="Preview" style="width: 40px; height: 40px; border-radius: 20px; background: #141417; border: 1px solid #2A2A31; color: #F3EFE7; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
            </button>
            <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.file}}</span>
              <span style="font-size: 12px; color: #A9A6AE">{{f.reason}}</span>
            </div>
            <button style="height: 40px; padding: 0 12px; border-radius: 20px; background: transparent; border: 1px solid #2A2A31; color: #F3EFE7; font-family: inherit; font-size: 13px; font-weight: 700; flex-shrink: 0">Restore</button>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 20px 24px 20px; border-top: 1px solid #1C1C21">
    <button style="flex-grow: 1; height: 52px; border-radius: 26px; background: transparent; border: 1px solid #2A2A31; color: #F3EFE7; font-family: inherit; font-size: 15px; font-weight: 700">Restore all</button>
    <button style="flex-grow: 1; height: 52px; border-radius: 26px; background: #F3EFE7; border: none; color: #0A0A0C; font-family: inherit; font-size: 15px; font-weight: 800">Looks right</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { name: 'SOUND EFFECTS', count: '[n]', files: [
          { file: 'whoosh_transition_02.mp3', reason: '0:03 · under 45 s, no beat grid' },
          { file: 'airhorn.wav', reason: '0:02 · under 45 s' },
          { file: 'rain_ambience_loop.mp3', reason: '2:10 · noise-like, no tonal content' }
        ] },
        { name: 'DUPLICATES', count: '[n]', files: [
          { file: 'Neon Highway (1).mp3', reason: 'Same audio as Neon Highway.mp3 · lower bitrate' }
        ] },
        { name: 'SPEECH', count: '[n]', files: [
          { file: 'voice_note_0412.m4a', reason: '1:48 · mostly speech' }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
